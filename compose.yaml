name: sapore-sdr
services:
  api:
    build: .
    image: ${SAPORE_IMAGE:-sapore-sdr:local}
    env_file: ${SAPORE_ENV_FILE:-.env}
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/supabase-ca
    secrets: [supabase-ca]
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  worker:
    build: .
    image: ${SAPORE_IMAGE:-sapore-sdr:local}
    env_file: ${SAPORE_ENV_FILE:-.env}
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/supabase-ca
    secrets: [supabase-ca]
    command: ["node", "--import", "tsx", "src/worker.ts"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
secrets:
  supabase-ca:
    file: ${SAPORE_CA_FILE:-.local/supabase-ca.crt}
